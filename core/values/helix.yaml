# Disable 4G Control Plane
omec-control-plane:
  enable4G: false

# Disable 5G RAN Simulator
5g-ran-sim:
  enable: false
  
# Override values for 5g-control-plane Helm Chart
# https://gerrit.opencord.org/sdcore-helm-charts/5g-control-plane/values.yaml
5g-control-plane:
  enable5G: true
  images:
    repository: ""  # image tags below are full references
    tags:
      amf: ghcr.io/helix-nextgen-cellular-core/amf:v1.0.0
      smf: ghcr.io/helix-nextgen-cellular-core/smf:v1.0.0
      udr: ghcr.io/helix-nextgen-cellular-core/udr:v1.0.0
      udm: ghcr.io/helix-nextgen-cellular-core/udm:v1.0.0
      pcf: ghcr.io/helix-nextgen-cellular-core/pcf:v1.0.0
      nrf: ghcr.io/helix-nextgen-cellular-core/nrf:v1.0.0
      nssf: ghcr.io/helix-nextgen-cellular-core/nssf:v1.0.0
      ausf: ghcr.io/helix-nextgen-cellular-core/ausf:v1.0.0
      sctplb: ghcr.io/helix-nextgen-cellular-core/sctplb:v1.0.0
      init: ghcr.io/helix-nextgen-cellular-core/pod-init:1.0.0
      webui: ghcr.io/helix-nextgen-cellular-core/5gc-webui:master-1121545
      metricfunc: ghcr.io/helix-nextgen-cellular-core/metricfunc:main-ea5e53f

    pullPolicy: Always

  resources:
    enabled: true
    sctplb:
      limits:
        cpu: 10
        memory: 2Gi
      requests:
        cpu: 10
        memory: 1Gi
    smf:
      limits:
        cpu: 40
        memory: 2Gi
      requests:
        cpu: 1
        memory: 1Gi
    amf:
      limits:
        cpu: 40
        memory: 2Gi
      requests:
        cpu: 1
        memory: 1Gi
    ausf:
      limits:
        cpu: 40
        memory: 2Gi
      requests:
        cpu: 1
        memory: 1Gi
    pcf:
      limits:
        cpu: 40
        memory: 2Gi
      requests:
        cpu: 1
        memory: 1Gi
    udr:
      limits:
        cpu: 40
        memory: 2Gi
      requests:
        cpu: 1
        memory: 1Gi
    udm:
      limits:
        cpu: 40
        memory: 2Gi
      requests:
        cpu: 1
        memory: 1Gi
    nssf:
      limits:
        cpu: 40
        memory: 2Gi        
      requests:
        cpu: 1
        memory: 1Gi
    webui:
      limits:
        cpu: 1
        memory: 1Gi
      requests:
        cpu: 1
        memory: 1Gi

    metricfunc:
      limits:
        cpu: 1
        memory: 1Gi
      requests:
        cpu: 1
        memory: 1Gi

  kafka:
    deploy: false

  mongodb:
    image:
      registry: ghcr.io
      repository: helix-nextgen-cellular-core/mongodb
    usePassword: false
    persistence:
      enabled: false
    # Uncomment following 2 lines to enable cluster replication
    architecture: replicaset
    replicaCount: 1
    resources:
      limits:
         cpu: 10
         memory: 9Gi
      requests:
         cpu: 10
         memory: 9Gi

  config:
    logger:
      AMF:
        debugLevel: error
        ReportCaller: false
      SMF:
        debugLevel: error
        ReportCaller: false
      UDR:
        debugLevel: error
        ReportCaller: false
      UDM:
        debugLevel: error
        ReportCaller: false
      NRF:
        debugLevel: error
        ReportCaller: false
      PCF:
        debugLevel: error
        ReportCaller: false
      AUSF:
        debugLevel: error
        ReportCaller: false
      SCTPLB:
        debugLevel: error
        ReportCaller: false
      NSSF:
        debugLevel: error
        ReportCaller: false
      N3IWF:
        debugLevel: error
        ReportCaller: false
    # library
      NAS:
        debugLevel: error
        ReportCaller: false
      FSM:
        debugLevel: error
        ReportCaller: false
      NGAP:
        debugLevel: error
        ReportCaller: false
      NamfComm:
        debugLevel: error
        ReportCaller: false
      NamfEventExposure:
        debugLevel: error
        ReportCaller: false
      NsmfPDUSession:
        debugLevel: error
        ReportCaller: false
      NudrDataRepository:
        debugLevel: error
        ReportCaller: false
      OpenApi:
        debugLevel: error
        ReportCaller: false
      Aper:
        debugLevel: error
        ReportCaller: false
      CommonConsumerTest:
        debugLevel: error
        ReportCaller: false
      PFCP:
        debugLevel: error
        ReportCaller: false
      MongoDBLibrary:
        debugLevel: error
        ReportCaller: false
      PathUtil:
        debugLevel: error
        ReportCaller: false
    # webui
      WEBUI:
        debugLevel: error
        ReportCaller: false

    mongodb:
      name: free5gc
      url: mongodb://mongodb-arbiter-headless #enable if cluster deployment required

    managedByConfigPod:
      enabled: true
      syncUrl: http://sdcore-adapter-v2-1.aether-roc.svc:8080/synchronize

    sctplb:
      deploy: true # if enabled then deploy sctp pod. 
                    # Once backend is stable, this option will be enabled by default
      ngapp:
        externalIp: {{ hostvars[inventory_hostname]['ansible_%s' | format(core.data_iface)]['ipv4']['address'] }}
        port: 38412

    upfadapter:
      deploy: false # If enabled then deploy upf adapter pod. 
                    # Once backend is stable, this option will be enabled by default

    metricfunc:
      deploy: true

    # Change AMF config here if rquired Most of the AMF config comes from Slice APIs
    # but some of the config is directly provided  thorugh helm chart
    amf:
      # Use externalIP if you need to access AMF from remote setup 
      # and you don't want setup NodePort Service Type
      cfgFiles:
        amfcfg.conf:
          configuration:
            # storing AMF subscribers in the datastore is disabled by default. 
            # Once internal testing is complete we will enable DBStore by default.
            enableDBStore: true
            enableNrfCaching: true
            enableScaling: true
            disableDRSM: false
            minLbSMF: false
            redisDb: 0

    # SMF config override. Refer helm chart values for more options.
    smf:
      cfgFiles:
        smfcfg.conf:
          configuration:
            # Storing AMF subscribers in the datastore is disabled by default. 
            # Once internal testing is complete we will enable DBStore by default.
            enableDBStore: true
            enableNrfCaching: true
            enableScaling: true
            bypassUPF: false
            redisDb: 1

    nrf:
      cfgFiles:
        nrfcfg.conf:
          configuration:
            mongoDBStreamEnable: false    # enable/disable MongoDB stream in NRF.
            nfProfileExpiryEnable: true  # if enabled, remove NF profile if no keepalive received
            nfKeepAliveTime: 60           # default timeout for NF profiles
            enableNrfCaching: true
            enableScaling: true

    ausf:
      cfgFiles:
        ausfcfg.conf:
          configuration:
            # storing AMF subscribers in the datastore is disabled by default. 
            # Once internal testing is complete we will enable DBStore by default.
            enableNrfCaching: true
            enableScaling: true

    udm:
      cfgFiles:
        udmcfg.conf:
          configuration:
            # storing AMF subscribers in the datastore is disabled by default. 
            # Once internal testing is complete we will enable DBStore by default.
            enableNrfCaching: true
            enableScaling: true
    
    pcf:
      cfgFiles:
        pcfcfg.conf:
          configuration:
            # storing AMF subscribers in the datastore is disabled by default. 
            # Once internal testing is complete we will enable DBStore by default.
            enableNrfCaching: true
            enableScaling: true

# Override values for omec-sub-provision (subscriber) Helm Chart
# https://gerrit.opencord.org/sdcore-helm-charts/omec-sub-provision/values.yaml
# ***Note: Most of these values can (and should) be set via ROC API***
omec-sub-provision:
  enable: true
  images:
    repository: ""  # image tags below are full references
    tags:
      init: ghcr.io/helix-nextgen-cellular-core/pod-init:1.0.0
      simapp: ghcr.io/helix-nextgen-cellular-core/simapp:main-a4f741a

  config:
    simapp:
      cfgFiles:
        simapp.yaml:
          configuration:
            provision-network-slice: {{ core.standalone }} # if enabled, Device Groups & Slices configure by simapp
            sub-provision-endpt:
              addr: webui.omec.svc.cluster.local  # subscriber configuation endpoint.

            # Configure Subscriber IMSIs and their security details.
            # You can have any number of subscriber ranges
            # This block is always necessary to establish range(s) of valid IMSIs
            subscribers:
            - ueId-start: "208930100007487"
              ueId-end: "208930100007500"
              plmnId: "20893"
              opc: "981d464c7c52eb6e5036234984ad0bcf"
              op: ""
              key: "5122250214c33e723a5dd523fc145fc0"
              sequenceNumber: "16f3b3f70fc2"
            - ueId-start: "208930100007501"
              ueId-end: "208930100008087"
              plmnId: "20893"
              opc: "981d464c7c52eb6e5036234984ad0bcf"
              op: ""
              key: "5122250214c33e723a5dd523fc145fc0"
              sequenceNumber: "16f3b3f70fc2"

            # Configure Device Groups (ignored if provision-network-slice is disabled)
