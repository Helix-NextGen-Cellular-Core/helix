gnbsim:
  docker:
    container:
      image: ghcr.io/helix-nextgen-cellular-core/gnbsim:v1.0.0
      count: 16
    network:
      macvlan:
        name: gnbnet

  router:
    data_iface: "{{ helix_data_iface }}"
    macvlan:
      iface: gnbaccess
      prefix: "172.20"
  
  core:
    upf:
      ip_prefix: "192.168.252.0/24"
    amf:
      ip: "{{ helix_core_ip }}"

collector:
  storage:
    logs_dir: "{{ helix_logs_dir }}"
